import org.wpilib.toolchain.*

plugins {
  id 'cpp'
  id 'java'
  id 'org.wpilib.WPILibRepositoriesPlugin' version '2027.0.0'
  id 'org.wpilib.NativeUtils' version '2027.14.3'
  id 'org.wpilib.GradleJni' version '2027.0.0'
  id 'org.wpilib.GradleVsCode' version '2027.0.0'
}

// WPILib Version
ext.wpilibVersion = "2027.+"

repositories {
  mavenCentral()
}
// wpilibRepositories.use2027Repos()
if (project.hasProperty('releaseMode')) {
  wpilibRepositories.addAllReleaseRepositories(project)
} else {
  wpilibRepositories.addAllDevelopmentRepositories(project)
}

// java {
//   sourceCompatibility = JavaVersion.VERSION_25
//   targetCompatibility = JavaVersion.VERSION_25
// }
var javaVersion = 25

// Apply C++ configuration
apply from: 'config.gradle'

// Apply Java configuration
dependencies {
    annotationProcessor "io.avaje:avaje-jsonb-generator:3.11"
    implementation "io.avaje:avaje-jsonb:3.11"
    implementation "org.wpilib.cscore:cscore-java:$wpilibVersion"
    implementation "org.wpilib.cameraserver:cameraserver-java:$wpilibVersion"
    implementation "org.wpilib.ntcore:ntcore-java:$wpilibVersion"
    implementation "org.wpilib.wpilibj:wpilibj-java:$wpilibVersion"
    implementation "org.wpilib.wpiutil:wpiutil-java:$wpilibVersion"
    implementation "org.wpilib.wpimath:wpimath-java:$wpilibVersion"
    implementation "org.wpilib.wpiunits:wpiunits-java:$wpilibVersion"
    implementation "org.wpilib.datalog:datalog-java:$wpilibVersion"
    implementation "org.wpilib.telemetry:telemetry-java:$wpilibVersion"
    implementation "org.wpilib.tunables:tunables-java:$wpilibVersion"
    implementation "org.wpilib.hal:hal-java:$wpilibVersion"
    implementation "org.ejml:ejml-simple:0.44.0"
    // implementation "com.fasterxml.jackson.core:jackson-annotations:2.19.2"
    // implementation "com.fasterxml.jackson.core:jackson-core:2.19.2"
    // implementation "com.fasterxml.jackson.core:jackson-databind:2.19.2"
    implementation 'org.wpilib.thirdparty.opencv:opencv-java:2027-4.13.0-3'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.13.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testRuntimeOnly 'us.hebi.quickbuf:quickbuf-runtime:1.4'
}

// Set up java tests
test {
    useJUnitPlatform()
    systemProperty 'junit.jupiter.extensions.autodetection.enabled', 'true'
    testLogging {
        events "failed"
        exceptionFormat = "full"
    }
}

if (project.hasProperty('onlylinuxarm64') || project.hasProperty('onlywindowsarm64') || project.hasProperty('onlylinuxsystemcore')) {
    test.enabled = false
}
// skip the tests all the time for now
// test.enabled = false

tasks.withType(JavaCompile) {
    options.compilerArgs.add '-XDstringConcat=inline'
    options.encoding = 'UTF-8'
    options.release = javaVersion
}

// Setup Javadocs to link back to WPILib docs
javadoc {
    options {
        addStringOption('Xdoclint:none', '-quiet')
        links "https://docs.oracle.com/en/java/javase/$javaVersion/docs/api/", 'https://github.wpilib.org/allwpilib/docs/release/java/'
    }
}

// Set up exports properly
nativeUtils {
  exportsConfigs {
  }
  privateExportsConfigs {
    gtsamwrapper {
      exportsFile = project.file("src/main/driver/symbols.txt")
    }
  }
}

ext.getCurrentArch = {
    return NativePlatforms.desktop
}

def systemArch = getCurrentArch()

model {
  components {
    gtsamwrapper (NativeLibrarySpec) {
      binaries {
        withType(StaticLibraryBinarySpec) {
          // only build the shared lib
          buildable = false
        }
        withType(SharedLibraryBinarySpec) {
          if (toolChain in Gcc || toolChain in Clang) {
            // Prints compiler driver steps and passes --verbose to ld
            linker.args "-v"
          } else if (toolChain in VisualCpp) {
            // Prints detailed MSVC linker progress and library search paths
            linker.args "/VERBOSE"
          }
          tasks.withType(LinkSharedLibrary) {
            libs.from(files("dbghelp.lib"))
          }
        }
      }
      // we never use the debug version for anything
      targetBuildTypes "release"
      // enableCheckTask true
      // javaCompileTasks << compileJava
      // jniCrossCompileOptions << JniCrossCompileOptions(nativeUtils.wpi.platforms.systemcore)
      // Leave these for future proofing
      // jniCrossCompileOptions << JniCrossCompileOptions(nativeUtils.wpi.platforms.linuxarm64)
      sources {
        cpp {
          source {
            srcDirs 'src/main/driver/cpp'
            include '**/*.cpp'
          }
          exportedHeaders {
            srcDirs 'src/main/driver/include'
          }
        }
      }
      // "driver_shared" is a key, see WPINativeUtilsExtension.java
      // it means "add wpi dependencies" which we do not need.
      // nativeUtils.useRequiredLibrary(it, "driver_shared", "gtsam")
      // "wpimath_shared" includes eigen, which is mentioned in the transitive
      // inclusions of our source files.
      nativeUtils.useRequiredLibrary(it, "wpimath_shared", "gtsam")
    }
  }
  tasks {
    // make the test task wait for the build task to complete
    test.dependsOn $.binaries.withType(SharedLibraryBinarySpec).findAll {it.buildable}.collect {it.buildTask}
  }
}

apply from: 'publish.gradle'

wrapper {
  gradleVersion = '9.4.1'
}
